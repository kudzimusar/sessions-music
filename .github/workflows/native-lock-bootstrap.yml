name: Native lock bootstrap

on:
  push:
    branches:
      - native/phase1-5-simulator-runtime
    paths:
      - 'native/sessions-native/package.json'
      - 'native/sessions-native/package-lock.json'
      - '.github/workflows/native-lock-bootstrap.yml'

permissions:
  contents: write

concurrency:
  group: native-lock-bootstrap
  cancel-in-progress: false

jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: native/phase1-5-simulator-runtime
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Generate or verify native lock
        working-directory: native/sessions-native
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            npm ci --include=dev --ignore-scripts
            node -e "const p=require('./package.json'),l=require('./package-lock.json'); if(p.dependencies['@supabase/supabase-js']!=='2.116.0'||l.packages[''].dependencies['@supabase/supabase-js']!=='2.116.0'||l.packages['node_modules/@supabase/supabase-js'].version!=='2.116.0') process.exit(1)"
            echo 'Native lockfile is committed and exact.'
            exit 0
          fi
          npm install --package-lock-only --include=dev --ignore-scripts
          node -e "const p=require('./package.json'),l=require('./package-lock.json'); if(p.dependencies['@supabase/supabase-js']!=='2.116.0'||l.packages[''].dependencies['@supabase/supabase-js']!=='2.116.0'||l.packages['node_modules/@supabase/supabase-js'].version!=='2.116.0') process.exit(1)"

      - name: Commit generated lockfile once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LOCK_PATH='native/sessions-native/package-lock.json'
          if git ls-files --error-unmatch "$LOCK_PATH" >/dev/null 2>&1; then
            echo 'Lockfile already tracked; no write required.'
            exit 0
          fi
          CONTENT="$(base64 < "$LOCK_PATH" | tr -d '\n')"
          gh api --method PUT "/repos/${GITHUB_REPOSITORY}/contents/${LOCK_PATH}" \
            -f message='Commit native dependency lockfile' \
            -f content="$CONTENT" \
            -f branch='native/phase1-5-simulator-runtime' >/dev/null
