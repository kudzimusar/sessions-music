name: Hosted Phase 4 Smoke

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/hosted-phase4-smoke.test.mjs
