name: Installed native UAT

on:
  pull_request:
    paths:
      - 'native/sessions-native/**'
      - 'packages/product-core/**'
      - '.github/workflows/installed-native-uat.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installed-native-uat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
  EXPO_NO_DEPLOY: '1'
  MAESTRO_VERSION: '2.7.0'

jobs:
  android-installed:
    name: Android Emulator installed UAT
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: native/sessions-native/package-lock.json

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install native dependencies
        working-directory: native/sessions-native
        run: npm ci --include=dev

      - name: Validate Expo project contract
        working-directory: native/sessions-native
        run: npm run doctor

      - name: Install pinned Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build, install and exercise Android app
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            cd native/sessions-native
            npx expo prebuild --clean --platform android
            npx expo run:android --variant release --no-bundler
            adb shell pm path com.sessionstech.sessions.uat | grep '^package:'
            maestro test .maestro/phase1-5-smoke.yml
            maestro test .maestro/native-diagnostics.yml
            maestro test .maestro/phase5-operations.yml
            adb exec-out screencap -p > android-installed-uat.png

      - name: Assert generated Android project is native
        working-directory: native/sessions-native
        run: |
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts
          ! grep -R "react-native-webview\|<WebView\|WebView(" -n app src android --exclude-dir=build

  ios-installed:
    name: iOS Simulator installed UAT
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: native/sessions-native/package-lock.json

      - name: Install native dependencies
        working-directory: native/sessions-native
        run: npm ci --include=dev

      - name: Validate Expo project contract
        working-directory: native/sessions-native
        run: npm run doctor

      - name: Install pinned Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Boot an available iPhone Simulator
        shell: bash
        run: |
          set -euo pipefail
          UDID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin)["devices"]; print(next(d["udid"] for runtime in data.values() for d in runtime if d["name"].startswith("iPhone")))')"
          test -n "$UDID"
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Build and install release app on iOS Simulator
        working-directory: native/sessions-native
        run: |
          set -euo pipefail
          npx expo prebuild --clean --platform ios
          npx expo run:ios --configuration Release --device "$SIMULATOR_UDID" --no-bundler
          xcrun simctl get_app_container "$SIMULATOR_UDID" com.sessionstech.sessions.uat app

      - name: Exercise installed iOS app with Maestro
        working-directory: native/sessions-native
        run: |
          maestro test .maestro/phase1-5-smoke.yml
          maestro test .maestro/native-diagnostics.yml
          maestro test .maestro/phase5-operations.yml
          xcrun simctl io "$SIMULATOR_UDID" screenshot ios-installed-uat.png

      - name: Assert generated iOS project is native
        working-directory: native/sessions-native
        run: |
          test -d ios
          find ios -maxdepth 2 \( -name '*.xcodeproj' -o -name '*.xcworkspace' \) | grep .
          ! grep -R "react-native-webview\|<WebView\|WebView(" -n app src ios --exclude-dir=Pods
